<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.660 -2.680 3.233 5.675">
<desc>《影韵》皮影角色分片装配图。每个 &lt;g&gt; 的 id 对应 ShadowPuppetPresenter 里的 GameObject 名称，圆心／矩形中心即世界坐标，也是美术图的 pivot。</desc>
